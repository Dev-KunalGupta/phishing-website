<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Report Suspicious Link - PhishGuard AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<nav class="navbar">
    <a href="/" class="logo">
        <span class="brand">PhishGuard AI</span>
    </a>

    <div class="nav-right">
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/#about">About</a>
            <a href="{{ url_for('report') }}">Report</a>
        </div>
    </div>
</nav>

<section class="report-section">

    <div class="report-container">

        <div class="report-left">
            <h1>Report a Suspicious Link</h1>

            <form method="POST" action="/submit-report" class="report-form">

                <label>URL *</label>
                <input type="text" name="url" placeholder="Enter the URL" required>

                <label>Description</label>
                <textarea name="description" rows="4"></textarea>

                <label>Observation</label>
                <textarea name="observation" rows="4"></textarea>

                <button type="submit" class="primary-btn">Submit</button>

            </form>
        </div>

        <div class="report-right">
            <!-- Optional illustration space -->
        </div>

    </div>

</section>

<footer class="footer">
    <div class="footer-left">
        <span class="brand">PhishGuard</span>
        <span>© PhishGuard Private Ltd. 2026</span>
    </div>

    <div class="footer-right">
        <a href="#">X</a>
        <a href="#">Facebook</a>
        <a href="#">LinkedIn</a>
        <a href="#">Instagram</a>
    </div>
</footer>

</body>
</html>
